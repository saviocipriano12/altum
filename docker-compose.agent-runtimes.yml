name: altum-agent-runtimes

services:
  freellmapi:
    # Repositório adotado: xxy2026/freellmapi (MIT). Para produção, substitua
    # latest por uma tag/imagem auditada antes de subir a infraestrutura.
    image: ${FREELLMAPI_IMAGE:-ghcr.io/tashfeenahmed/freellmapi:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?Defina FREELLMAPI_ENCRYPTION_KEY no arquivo .env.agent-runtimes}
    ports:
      - "127.0.0.1:${FREELLMAPI_PORT:-3011}:3001"
    volumes:
      - altum-freellmapi-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  altum-freellmapi-data:
